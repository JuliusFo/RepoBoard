# Publishes a GitHub release when a version tag (v1.2.3) is pushed (WP-10, ADR 0007; as FerretSharp's): self-contained
# win-x64 build, packed with Velopack into Setup.exe, a portable zip and the update packages the app looks for. Release
# notes from the tag's section in CHANGELOG.md.
# For a tag that already exists: run it by hand (Actions → Release → Run workflow) with the tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.2.0
        required: true

permissions:
  contents: write

# One release at a time (FerretSharp review 3.40.0, A35): two tags pushed in a row would otherwise run side by side, and
# the second would take as the base of its delta package a release that is still a draft.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TAG: ${{ inputs.tag || github.ref_name }}
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      # Pinned to commits: this job may write releases; Dependabot keeps the pins current. Without the token in .git/config
      # (FerretSharp review 3.54.0, A7): the build and tests run code from NuGet packages; only the two vpk steps get the
      # token, through their environment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Check the version
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Not a version tag: $env:TAG" }
          $version = $Matches[1]
          $declared = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($declared -ne $version) { throw "Tag $env:TAG does not match <Version>$declared</Version> in Directory.Build.props." }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Unit tests
        run: dotnet test --solution RepoBoard.slnx

      - name: Publish
        run: dotnet publish src/RepoBoard.App -c Release -r win-x64 --self-contained -o "publish/RepoBoard-$env:VERSION-win-x64"

      - name: Release notes from CHANGELOG.md
        run: |
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $heading = $lines | Select-String -Pattern "^## \[$([regex]::Escape($env:VERSION))\]" | Select-Object -First 1
          if (-not $heading) { throw "CHANGELOG.md has no section [$env:VERSION]." }
          $section = @()
          foreach ($line in $lines[$heading.LineNumber..($lines.Count - 1)]) {
            if ($line -match '^## \[') { break }
            $section += $line
          }
          $changes = ($section -join "`n").Trim()
          # What the app shows in its update dialog (packed into the release by vpk).
          Set-Content changes.md $changes -Encoding utf8
          $notes = $changes + "`n`n---`n**Download** (Windows 10/11, x64; the WebView2 runtime is part of Windows):`n" +
            "- ``RepoBoard-win-Setup.exe`` – installs RepoBoard for your user (no admin rights); the app reports new versions, downloading and installing wait for your click. The installer is not signed: Windows SmartScreen warns once (More info › Run anyway).`n" +
            "- ``RepoBoard-win-Portable.zip`` – the same without installing; unzip anywhere and start ``RepoBoard.exe``, it updates itself too.`n" +
            "`nThe repository list and settings stay in ``%APPDATA%\RepoBoard`` whichever you choose."
          Set-Content notes.md $notes -Encoding utf8

      - name: Restore tools
        run: dotnet tool restore

      # The last Velopack release, so vpk can make a delta package from it. None for the first release: full packages only.
      # If there is one and the download fails (API, rate limit, token), stop (WP-10 review): the release would quietly have
      # no delta, and the update dialog would miss the notes of the versions skipped.
      - name: Previous release for delta packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The exit code before filtering: Select-Object -First stops the pipeline, and $LASTEXITCODE is then not set.
          $tags = gh release list --repo $env:REPO_URL --exclude-drafts --exclude-pre-releases --limit 20 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'gh release list failed.' }
          $previous = $tags | Where-Object { $_ -ne $env:TAG } | Select-Object -First 1
          $hasFeed = $false
          if ($previous) {
            $assets = gh release view $previous --repo $env:REPO_URL --json assets --jq '.assets[].name'
            if ($LASTEXITCODE -ne 0) { throw "gh release view $previous failed." }
            $hasFeed = @($assets) -contains 'releases.win.json'
          }
          dotnet vpk download github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --outputDir releases
          if ($LASTEXITCODE -ne 0) {
            if ($hasFeed) { throw "Release $previous has Velopack packages, but vpk could not download them." }
            Write-Warning "No previous Velopack release found – this release has full packages only."
            $global:LASTEXITCODE = 0
          }

      # The .pdb files stay in the package (stack traces in the log with line numbers): '^$' never matches, it replaces
      # vpk's default exclude of *.pdb.
      - name: Pack with Velopack
        run: >
          dotnet vpk pack --packId RepoBoard --packVersion $env:VERSION --packTitle RepoBoard
          --packDir "publish/RepoBoard-$env:VERSION-win-x64" --mainExe RepoBoard.exe
          --icon src/RepoBoard.App/RepoBoard.ico --releaseNotes changes.md
          --exclude '^$' --outputDir releases

      # vpk creates the release as a draft with its assets (Setup.exe, portable zip, packages, releases.win.json); then the
      # notes and publish.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet vpk upload github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --outputDir releases --tag $env:TAG --releaseName "RepoBoard $env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed." }
          gh release edit $env:TAG --repo $env:REPO_URL --title "RepoBoard $env:VERSION" --notes-file notes.md --draft=false
