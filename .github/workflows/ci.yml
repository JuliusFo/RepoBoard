# Build and tests on every push to main and every pull request.
# Linux: Core and UI must build without Windows APIs (CLAUDE.md, section 4); unit tests, including the ones against real
# git repositories in a temp folder, with code coverage (summary on the run page, HTML report as artifact).
# Windows: the whole solution including the WPF host; unit tests.
# Line endings: every committed text file must equal its normalized form (no CRLF in the repository).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer run of the same pull request (or of main) cancels the older one. Pull requests are keyed by their number, not
# by github.ref: a pull_request run that GitHub starts only after the merge no longer has the refs/pull/N/merge ref and
# would land in the group of main – cancelling main's run of the merge commit (learned in FerretSharp, fix-ci-concurrency).
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux:
    name: Core, UI and tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COVERAGE_ARGS: >-
        --coverage --coverage-output-format cobertura
        --coverage-settings ${{ github.workspace }}/tests/coverage.config
        --results-directory ${{ github.workspace }}/coverage
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build Core and UI
        run: |
          dotnet build src/RepoBoard.Core -warnaserror
          dotnet build src/RepoBoard.UI -warnaserror

      - name: Unit tests
        run: |
          dotnet test tests/RepoBoard.Core.Tests $COVERAGE_ARGS --coverage-output core.cobertura.xml
          dotnet test tests/RepoBoard.UI.Tests $COVERAGE_ARGS --coverage-output ui.cobertura.xml

      - name: Coverage report
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:'coverage/*.cobertura.xml' -targetdir:coverage/report \
            -reporttypes:'Html;MarkdownSummaryGithub' -title:RepoBoard
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/report
          retention-days: 14

  # Every committed text file must equal its normalized form. Its own job, so a hit does not skip build and tests.
  line-endings:
    name: Line endings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Normalized form
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            echo "::error::Files differ from their normalized form (CRLF in the repository). Fix with: git add --renormalize <file>; a stray CR (CR CR LF) has to be removed in the file itself first."
            git -c core.quotePath=false diff --cached --stat=200
            exit 1
          fi

  windows:
    name: Solution (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -warnaserror

      - name: Unit tests
        run: |
          dotnet test tests/RepoBoard.Core.Tests --no-build
          dotnet test tests/RepoBoard.UI.Tests --no-build
          dotnet test tests/RepoBoard.App.Tests --no-build

      # What release.yml builds after the tag, built before it: a warning only Release or the runtime pack shows would
      # otherwise fail the release with the tag already pushed (review 0.4.0, B11). Nothing is uploaded.
      - name: Release publish (self-contained)
        run: dotnet publish src/RepoBoard.App -c Release -r win-x64 --self-contained -o ${{ runner.temp }}/publish
